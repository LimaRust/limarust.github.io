/* Layout: одностраничный сайт. Скошенная навигация сверху, секции на тёмных панелях, как в игровом меню. */
:root{
  --bg:#0c0e09; --panel:#181A14; --panel2:#22251C; --panel3:#2A2E22; --line:#343a28;
  --lime:#D4E85A; --lime-d:#1B2108; --green:#6DBE3A; --orange:#F29A3C; --rust:#D2561F; --rust-d:#7A2E10;
  --fg:#F0F2E4; --mute:#98A088; --dim:#6B7455;
  --f-px:'Rubik',system-ui,sans-serif; --f-ui:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-ui);
  background-image:radial-gradient(70% 40% at 50% 0%,#1d2412 0%,transparent 70%)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font-family:var(--f-ui);cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.px{font-family:var(--f-px)}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(12,14,9,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.hd{display:flex;align-items:center;gap:14px;height:72px;max-width:none;padding-inline:max(18px,env(safe-area-inset-left,0px)) max(18px,env(safe-area-inset-right,0px))}
.brand-s{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 24px var(--f-ui);letter-spacing:-.3px}
nav.main{flex:1;display:flex;justify-content:center}
.tabs{display:flex;background:var(--panel3);border-bottom:3px solid var(--lime);padding:0 18px;height:46px;align-items:center;gap:2px;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.tabs a{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);text-decoration:none;padding:8px 11px;position:relative;white-space:nowrap}
.tabs a:hover{color:var(--fg)}.tabs a.on{color:var(--lime)}
.tabs a.on::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:2px;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 22px;font:600 15px var(--f-ui);background:var(--panel2);color:var(--lime);box-shadow:0 4px 0 #000;text-decoration:none;transition:.12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.pri{background:var(--lime);color:var(--lime-d)}.btn.org{background:var(--orange);color:#2a1604}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;transform:none;pointer-events:none}
.burger{display:none;width:46px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:20px}
/* sections */
section{padding-block:64px}
.ttl{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:34px}
.ttl h2{font:800 clamp(26px,4vw,38px)/1.1 var(--f-ui);letter-spacing:.5px;text-align:center;color:var(--fg)}
.ttl i{flex:1;max-width:180px;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--lime))}
.ttl i:last-child{background:linear-gradient(270deg,transparent,var(--lime))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px}
.mut{color:var(--mute)}.price{color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
/* hero */
.hero{position:relative;overflow:hidden;padding-block:72px 56px;text-align:center}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px}
.hero h1{font:800 clamp(52px,10vw,112px)/1 var(--f-ui);letter-spacing:-2px;margin:6px 0 4px}
.lead{max-width:560px;color:var(--mute);font-size:18px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{padding:4px 14px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.3);font-weight:600;letter-spacing:1px}
.ipbox{display:flex;align-items:stretch;border:1px solid var(--lime);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.35);max-width:100%}
.ipbox span{padding:12px 18px;font:600 18px ui-monospace,Consolas,monospace;color:var(--lime);overflow-wrap:anywhere}
.ipbox button{border:0;background:var(--lime);color:var(--lime-d);font-weight:600;padding:0 18px}
.cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;max-width:820px;margin-top:10px}
.stat{padding:14px;text-align:center}
.stat b{display:block;font:700 28px var(--f-px);color:var(--lime);font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--mute)}
.dot.off{background:#7d836f;box-shadow:none;animation:none}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);margin-right:6px;animation:p 1.8s infinite}
@keyframes p{50%{opacity:.35}}
/* promo band */
.band{background:linear-gradient(90deg,var(--lime),var(--orange),var(--lime));background-size:200% 100%;animation:shim 8s ease-in-out infinite alternate;color:var(--lime-d)}
@keyframes shim{from{background-position:0 0}to{background-position:100% 100%}}
@media (prefers-reduced-motion:reduce){.band,.next{animation:none}}
.band .wrap{display:flex;gap:16px;align-items:center;padding-block:12px;flex-wrap:wrap;justify-content:center}
.band b{font:700 20px var(--f-px)}.band span{font-weight:600}
.band .btn{background:var(--lime-d);color:var(--lime);padding:8px 16px}
/* why */
.why{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.why .card{padding:22px}.why h3{font-size:19px;margin:12px 0 6px}.why p{margin:0;color:var(--mute)}
.why .wic{height:112px;border-radius:12px;background:radial-gradient(circle at 50% 40%,#30351f,#1b1e15);display:flex;align-items:center;justify-content:center}
.why .wic svg{width:84px;height:auto}
.rlw{position:relative;height:112px;overflow:hidden;border-radius:12px;background:#10120c;border:1px solid var(--line)}
.rlt{display:flex;gap:8px;position:absolute;left:0;top:0;padding:10px 0;animation:rlmove 28s linear infinite}
.rlw:hover .rlt{animation-play-state:paused}
@keyframes rlmove{to{transform:translateX(-50%)}}
.rcc{width:96px;height:92px;flex:none;border-radius:10px;background:var(--panel2);border:1px solid var(--line);border-bottom:4px solid var(--c,var(--mute));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;text-align:center;padding:4px;color:var(--mute)}
.rcc svg{width:44px;height:auto}
.rcc img{width:50px;height:50px;object-fit:contain}
.why .wic img{height:92px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.why .wic.collage{gap:0;padding-inline:8px;overflow:hidden}
.why .wic.collage img{flex:1 1 0;width:0;min-width:0;height:78px;max-width:none;margin-inline:-5px}
.emb{display:block;width:100%;max-width:230px;aspect-ratio:1;margin:0 auto;object-fit:contain;transition:transform .2s}
.card:hover>.emb{transform:scale(1.04)}
.grp{font:700 24px var(--f-px);margin:30px 0 16px;color:var(--lime)}
.blk{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bk{padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;border-color:var(--line);transition:border-color .3s}
.bk img{width:64px;height:64px;object-fit:contain}
.bk b{font-size:14px;line-height:1.2}
.bk .bt{font:700 16px var(--f-px);color:var(--orange)}
.bk.open{border-color:var(--lime)}
.bk.open .bt{color:var(--lime)}
.vt{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.vc{display:flex;flex-direction:column;gap:8px}.vc.mine{border-color:var(--lime)}.vn{font:700 12px var(--f-px);color:var(--orange)}.vb{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.vb i{display:block;height:100%;background:var(--lime)}.vs small{display:block;color:var(--mute);font-size:12px}.nw{display:grid;gap:12px}
.rlm{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--orange);box-shadow:0 0 14px var(--orange);z-index:2}
.rlw::before,.rlw::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:1;pointer-events:none}
.rlw::before{left:0;background:linear-gradient(90deg,#10120c,transparent)}.rlw::after{right:0;background:linear-gradient(270deg,#10120c,transparent)}
/* ranks */
.ranks{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.rank{padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.ranks{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.rank{align-items:center;text-align:center;gap:4px;padding:18px 14px 20px}
.rank .rimg{width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));transition:transform .25s}.rank:hover .rimg{transform:scale(1.07) rotate(-3deg)}
.rank .rno{font:700 11px var(--f-ui);letter-spacing:1.6px;text-transform:uppercase;color:var(--orange);margin-top:2px}
.rank h3{font:800 21px var(--f-ui);margin:0}.rank .rsub{font-size:13px;color:var(--mute)}
.rank .hrs{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;background:var(--lime-d);border:1px solid rgba(212,232,90,.4)}
.rank p{margin-top:8px;color:var(--fg);font-size:13.5px}.rank p b{color:var(--lime)}
.rank h3.old{font:700 19px var(--f-px)}.rank .hrs{font-size:13px;color:var(--lime);font-weight:600}.rank p{margin:0;font-size:13px;color:var(--mute)}
.rank svg{width:60px;height:auto}
.exs{display:flex;gap:6px;justify-content:center;margin:8px 0}.exs img{width:46px;height:46px;object-fit:contain}.kn{text-align:center;margin:24px 0 0;font-size:13px}
/* shop */
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.pill{border:1px solid var(--line);background:var(--panel2);padding:7px 15px;border-radius:20px;font-weight:600;font-size:14px;color:var(--mute)}
.pill:hover{color:var(--fg)}.pill.on{background:var(--lime);color:var(--lime-d);border-color:var(--lime)}
.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;transition:.12s}
.item:hover{border-color:var(--lime);transform:translateY(-3px)}
.item .ic{height:92px;border-radius:9px;background:radial-gradient(circle at 50% 40%,#30351f,#1b1e15);display:flex;align-items:center;justify-content:center}
.item .ic svg{width:64px;height:auto}
.item .nm{font-size:14px;font-weight:500;line-height:1.25}.item .ft{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.tag{position:absolute;top:8px;left:8px;font:700 10px var(--f-ui);padding:2px 7px;border-radius:5px;background:var(--orange);color:#2a1604;letter-spacing:.5px}
.note{margin-top:18px;text-align:center;color:var(--mute);font-size:14px}
/* kits */
.kits{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kit{padding:16px;display:flex;flex-direction:column;gap:10px}
.kit.prem{border-color:#7a5a22}
.kit .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.kit h3{font:700 20px var(--f-px)}.kit ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px;color:var(--mute)}
.kit li::before{content:"+ ";color:var(--lime);font-weight:600}
.kit .cd{margin-top:auto;font-size:13px;border-top:1px dashed var(--line);padding-top:10px}
/* wipe */
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.next{padding:28px;text-align:center;background:linear-gradient(135deg,var(--lime),var(--orange),var(--lime));background-size:200% 200%;animation:shim 8s ease-in-out infinite alternate;color:var(--lime-d);border:0}
.next b.px{font-size:30px;display:block}
.cd4{display:flex;gap:10px;justify-content:center;margin:16px 0}
.cd4 div{background:rgba(0,0,0,.22);border-radius:10px;padding:10px 14px;min-width:70px}
.cd4 b{display:block;font:700 30px var(--f-px);font-variant-numeric:tabular-nums}.cd4 span{font-size:12px;font-weight:600}
.wl{padding:8px}.wl li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.wl li:last-child{border:0}.wl ul{margin:0;padding:0}
.wl b{color:var(--lime)}
/* rules + cmds */
.rules .card{padding:22px}
.rup{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}.rup .card{display:flex;flex-direction:column;overflow:hidden;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}.rup .card:hover{border-color:var(--lime);transform:translateY(-2px)}.rup img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.rup .rb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}.rup h3{margin:0;font-size:19px}.rup p{margin:0;font-size:14px}.rup .rm{margin-top:auto;padding-top:8px;color:var(--lime);font-size:13px}
.fch{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.fc{background:var(--panel2);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:7px 14px;font:600 13px var(--f-ui);cursor:pointer}.fc:hover{color:var(--fg)}.fc.on{background:var(--lime);color:#14160f;border-color:var(--lime)}
.wkbar{display:grid;gap:12px;margin-bottom:18px}.wkbar input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:500 15px var(--f-ui)}
.wkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.wki{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;text-align:center;color:inherit;cursor:pointer;font:inherit}.wki:hover{border-color:var(--lime)}.wki img{width:64px;height:64px;object-fit:contain}.wki b{font-size:14px}.wki span{font-size:12px}
#main.pgin>*{animation:pgIn .4s ease both}@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tl{display:flex;flex-direction:column;gap:6px;padding:20px 22px 24px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel3));text-decoration:none;color:var(--fg);position:relative;overflow:hidden;transition:.18s}
.tl:hover{border-color:var(--lime);transform:translateY(-3px);box-shadow:0 10px 30px rgba(212,232,90,.13)}
.tl b{font:700 20px var(--f-px);color:var(--lime)}.tl small{color:var(--mute);font-size:13px}
.tl::after{content:"→";position:absolute;right:16px;bottom:12px;color:var(--orange);font-size:20px;transition:.18s}.tl:hover::after{right:10px}
.tl.wide{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 16px;border-color:var(--orange);background:linear-gradient(110deg,rgba(242,154,60,.16),var(--panel2) 60%)}
.ub{display:inline-block;align-self:flex-start;font:700 11px var(--f-ui);letter-spacing:1.4px;padding:5px 10px;border-radius:999px;background:var(--panel3);color:var(--mute);border:1px solid var(--line)}
.ub.new{background:var(--orange);color:#1b1306;border-color:var(--orange);animation:ubp 2s ease-in-out infinite}@keyframes ubp{50%{box-shadow:0 0 0 6px rgba(242,154,60,.18)}}
.uph{position:relative;display:block;min-height:340px;border-radius:18px;overflow:hidden;border:1px solid var(--lime);text-decoration:none;color:var(--fg);margin-bottom:26px;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.uph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}.uph:hover img{transform:scale(1.05)}
.uph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,16,10,.15) 20%,rgba(14,16,10,.92) 85%)}
.uph.ev{border-color:var(--orange)}
.uphb{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;min-height:340px;padding:26px 30px}
.uphb h3{margin:0;font:700 clamp(28px,5vw,46px)/1.05 var(--f-px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5)}.uphb p{margin:0;max-width:720px;color:#d8dccb}.uphb .rm{color:var(--lime)}
.uyt{position:relative;margin:30px 0 14px;text-align:center}.uyt::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.uyt span{position:relative;background:var(--bg,#0e100a);padding:0 18px;font:700 34px var(--f-px);color:var(--lime);text-shadow:0 0 18px rgba(212,232,90,.35)}
.utl{position:relative;display:grid;gap:16px;padding:4px 0}
.utl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:linear-gradient(var(--lime),var(--orange));opacity:.55;border-radius:2px}
.ui{position:relative;display:flex;gap:14px;width:calc(50% - 30px);padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);text-decoration:none;color:var(--fg);transition:.18s}
.ui:nth-child(even){margin-left:auto}
.ui::after{content:"";position:absolute;top:30px;right:-39px;width:15px;height:15px;border-radius:50%;background:var(--lime);border:3px solid var(--bg,#0e100a);box-shadow:0 0 14px var(--lime)}
.ui:nth-child(even)::after{right:auto;left:-39px}
.ui.ev::after{background:var(--orange);box-shadow:0 0 14px var(--orange)}.ui.ev{border-color:rgba(242,154,60,.5)}
.ui:hover{border-color:var(--lime);transform:translateY(-2px)}

 let last=performance.now();
 (function f(now){if(!c.isConnected)return;const dt=Math.min(100,now-last);last=now;x.clearRect(0,0,w,h);

  if(!still)requestAnimationFrame(f)})(last)}

 if(AS==='cmds')h=`<h3>Команды</h3>${C.cmds.map((c,i)=>`<div class="er">${I('cmds.'+i+'.0',c[0],'s','/команда')}${I('cmds.'+i+'.1',c[1],'','Описание')}${X('cmds',i)}</div>`).join('')}${ADD('cmds','cmd','Команда')}`;
 if(AS==='faq')h=`<h3>Вопросы</h3>${C.faq.map((f,i)=>`<div class="er w">${I('faq.'+i+'.q',f.q,'','Вопрос')}${X('faq',i)}<div class="er" style="flex-basis:100%">${I('faq.'+i+'.a',f.a,'','Ответ')}</div></div>`).join('')}${ADD('faq','faq','Вопрос')}`;
 if(AS==='don')h=`<h3>Донат</h3><div class="lb">Адрес оплаты</div><div class="er">${I('pay',C.pay,'','https://... (пусто = все «В разработке»)')}</div><div class="mut">Пока адрес не указан, на всех привилегиях кнопка «В разработке». Цены в евро.</div><div class="lb">Привилегии</div>${C.donate.map((d,i)=>`<div class="er w">${I('donate.'+i+'.n',d.n,'s','Название')}${N('donate.'+i+'.price',d.price)}${I('donate.'+i+'.tag',d.tag,'s','Метка')}${K('donate.'+i+'.dev',d.dev,'В разработке')}${X('donate',i)}<div class="er" style="flex-basis:100%">${I('donate.'+i+'.perks',d.perks,'','Что даёт, через запятую')}</div></div>`).join('')}${ADD('donate','pkg','Привилегию')}`;
 if(AS==='links')h=`<h3>Ссылки</h3><div class="lb">Discord</div><div class="er">${I('discord',C.discord,'','discord.gg/...')}</div><div class="lb">Telegram</div><div class="er">${I('telegram',C.telegram,'','t.me/...')}</div><div class="lb">Группа Steam</div><div class="er">${I('steam',C.steam,'','steamcommunity.com/groups/...')}</div>`;
 if(AS==='access')h=`<h3>Доступ</h3><div class="mut">Администратор определяется по Steam ID. Игроку можно выдать привилегию, и она покажется в его кабинете. Сейчас проверка идёт в браузере (демо). На боевом сайте проверка выполняется на сервере после входа через Steam.</div><div class="lb">Администраторы</div>${C.admins.map((a,i)=>`<div class="er">${I('admins.'+i+'.id',a.id,'','Steam ID (17 цифр)')}${I('admins.'+i+'.nick',a.nick,'s','Ник')}${X('admins',i)}</div>`).join('')}${ADD('admins','admin','Администратора')}<div class="lb">Игроки с привилегиями</div>${C.players.map((p,i)=>`<div class="er w">${I('players.'+i+'.id',p.id,'','Steam ID (17 цифр)')}${I('players.'+i+'.nick',p.nick,'s','Ник')}<select class="in s" data-p="players.${i}.priv" data-ty="s">${['—',...C.donate.map(d=>d.n)].map(n=>`<option ${p.priv===n?'selected':''}>${esc(n)}</option>`).join('')}</select>${N('players.'+i+'.hours',p.hours)}${X('players',i)}</div>`).join('')}<div class="mut">Колонки: Steam ID, ник, привилегия, часов на сервере.</div>${ADD('players','player','Игрока')}`;
 if(AS==='sys')h=`<h3>Данные</h3><div class="mut">Правки применяются сразу и сохраняются. В боевой версии это конфиг на сервере.</div><div class="er w"><button class="btn pri sm" id="exp">Скопировать JSON</button><button class="btn sm" id="rv">Сбросить голоса</button><button class="btn sm" id="rst" style="color:#E0654A">Сбросить всё</button></div>`;
 const b=$('#db'),y=b.scrollTop;b.innerHTML=h;b.scrollTop=y}
const openDr=()=>{drawer();$('#dr').classList.add('on')};

let dbT;
document.addEventListener('input',e=>{const t=e.target;if(t.id==='rq'){RV.q=t.value;const s=SEC.rules();const tmp=document.createElement('div');tmp.innerHTML=s;$('#rb').innerHTML=tmp.querySelector('#rb').innerHTML;applyLang($('#rb'));const pn=$('#rules .pn');if(pn)pn.style.display=RV.q.trim()?'none':'';$$('#rules .rm nav button').forEach(x=>x.classList.toggle('on',!RV.q.trim()&&+x.dataset.rt===RV.t));return}
 if(t.id==='sq'){renderTop(t.value);return}
 if(t.dataset&&t.dataset.p){const v=t.type==='checkbox'?t.checked:t.dataset.ty==='n'?(parseFloat(t.value)||0):t.value;setP(t.dataset.p,v);save();clearTimeout(dbT);dbT=setTimeout(()=>{renderSite();if(t.dataset.p.startsWith('wipe'))drawer()},250)}});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.mu)return;const f=t.files&&t.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);getP(t.dataset.mu).img=c.toDataURL('image/jpeg',.82);save();renderSite();drawer();toast('Картинка карты загружена')};im.onerror=()=>toast('Не удалось открыть картинку');im.src=fr.result};fr.readAsDataURL(f)});
document.addEventListener('click',e=>{const z=e.target.closest('[data-zoom]');if(z){const src=z.tagName==='CANVAS'?z.toDataURL():z.src;modal(`<img class="zimg" src="${src}" alt="Карта"><div class="row"><button class="btn pri" data-close>Закрыть</button></div>`);return}
 const t=e.target.closest('button,a,[data-cp]');if(!t){if(e.target.id==='ov')closeM();return}const d=t.dataset;
 if(d.cp)copy(d.cp);
 else if(d.vote!==undefined)castSiteVote(+d.vote);
 else if(d.ts){TOPSORT=d.ts;renderSite();renderTop($('#sq')?$('#sq').value:'')}
 else if(d.setlang)setLang(d.setlang);
 else if(t.hasAttribute('data-login'))loginM();
 else if(t.hasAttribute('data-logout')){ACC=null;saveA();$('#dr').classList.remove('on');renderSite();toast('Ты вышел из аккаунта')}
 else if(t.hasAttribute('data-close'))closeM();
 else if(d.legal)legal(d.legal);
 else if(d.mclear){delete getP(d.mclear).img;save();renderSite();drawer();toast('Картинка убрана')}
 else if(t.id==='lsteam')location.href=API_URL+'/api/auth/steam';
 else if(t.hasAttribute('data-linksteam'))linkSteam();

 else if(d.rt!==undefined){RV.t=+d.rt;RV.q='';renderSite()}
 else if(d.rp){const n=C.rules.length+1;RV.t=(RV.t+ +d.rp+n)%n;renderSite()}
 else if(t.hasAttribute('data-drawer'))openDr();
 else if(t.id==='drx')$('#dr').classList.remove('on');
 else if(d.as){AS=d.as;drawer()}
 else if(d.del){const [p,i]=d.del.split('|');getP(p).splice(+i,1);save();drawer();renderSite()}
 else if(d.add){getP(d.add).push(TPL[d.tpl]());save();drawer();renderSite();const b=$('#db');b.scrollTop=b.scrollHeight}
 else if(t.id==='exp')copy(JSON.stringify(C,null,2))
 else if(t.id==='rv'){C.maps.forEach(m=>m.votes=0);MYVOTE=null;try{localStorage.removeItem('lima_vote3')}catch(x){}save();renderSite();drawer();toast('Голоса сброшены')}
 else if(t.id==='rst'){C=DEFAULT();save();renderSite();drawer();toast('Настройки сброшены')}
 else if(t.id==='bg'){const o=$('#nav').classList.toggle('open');t.setAttribute('aria-expanded',o)}
 else if(t.closest('#nav')&&t.tagName==='A')$('#nav').classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();$('#dr').classList.remove('on')}
 if(e.target.closest&&e.target.closest('#rules .rm')&&!(e.target.tagName==='INPUT')&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const n=C.rules.length+1,dlt=(e.key==='ArrowUp'||e.key==='ArrowLeft')?-1:1;RV.t=(RV.t+dlt+n)%n;RV.q='';renderSite();const b=$(`#rules [data-rt="${RV.t}"]`);if(b)b.focus()}});

(async()=>{
 const h=new URLSearchParams(location.hash.slice(1));
 if(h.get('token')){tokenSet(h.get('token'));history.replaceState(null,'',location.pathname+location.search)}
 else if(h.get('login')==='failed'){history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>toast('Не удалось войти через Steam'),300)}
 renderSite();
 await Promise.all([loadSession(),loadLive()]);paintOnline();
 renderSite();
