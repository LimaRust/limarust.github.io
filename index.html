<title>Lima Rust Сайт</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: одностраничный сайт. Скошенная навигация сверху, секции на тёмных панелях, как в игровом меню. */
:root{
  --bg:#0c0e09; --panel:#181A14; --panel2:#22251C; --panel3:#2A2E22; --line:#343a28;
  --lime:#D4E85A; --lime-d:#1B2108; --green:#6DBE3A; --orange:#F29A3C; --rust:#D2561F; --rust-d:#7A2E10;
  --fg:#F0F2E4; --mute:#98A088; --dim:#6B7455;
  --f-px:'Pixelify Sans','Courier New',monospace; --f-ui:'Rubik',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-ui);
  background-image:radial-gradient(70% 40% at 50% 0%,#1d2412 0%,transparent 70%)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font-family:var(--f-ui);cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.px{font-family:var(--f-px)}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(12,14,9,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.hd{display:flex;align-items:center;gap:14px;height:72px}
.brand-s{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 24px var(--f-px);color:var(--green);text-shadow:2px 2px 0 var(--rust)}
nav.main{flex:1;display:flex;justify-content:center}
.tabs{display:flex;background:var(--panel3);border-bottom:3px solid var(--lime);padding:0 18px;height:46px;align-items:center;gap:2px;clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.tabs a{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);text-decoration:none;padding:8px 11px;position:relative;white-space:nowrap}
.tabs a:hover{color:var(--fg)}.tabs a.on{color:var(--lime)}
.tabs a.on::after{content:"";position:absolute;left:11px;right:11px;bottom:0;height:2px;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 22px;font:600 15px var(--f-ui);background:var(--panel2);color:var(--lime);box-shadow:0 4px 0 #000;text-decoration:none;transition:.12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.pri{background:var(--lime);color:var(--lime-d)}.btn.org{background:var(--orange);color:#2a1604}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;transform:none;pointer-events:none}
.burger{display:none;width:46px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:20px}
/* sections */
section{padding-block:64px}
.ttl{display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:34px}
.ttl h2{font:700 clamp(26px,4vw,38px)/1.1 var(--f-px);letter-spacing:1px;text-align:center}
.ttl i{flex:1;max-width:180px;height:6px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--lime))}
.ttl i:last-child{background:linear-gradient(270deg,transparent,var(--lime))}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px}
.mut{color:var(--mute)}.price{color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:16px}
/* hero */
.hero{position:relative;overflow:hidden;padding-block:72px 56px;text-align:center}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px}
.hero h1{font:700 clamp(48px,11vw,120px)/1 var(--f-px);color:var(--green);text-shadow:4px 4px 0 var(--rust),8px 8px 0 var(--rust-d)}
.lead{max-width:560px;color:var(--mute);font-size:18px}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{padding:4px 14px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.3);font-weight:600;letter-spacing:1px}
.ipbox{display:flex;align-items:stretch;border:1px solid var(--lime);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.35);max-width:100%}
.ipbox span{padding:12px 18px;font:600 18px ui-monospace,Consolas,monospace;color:var(--lime);overflow-wrap:anywhere}
.ipbox button{border:0;background:var(--lime);color:var(--lime-d);font-weight:600;padding:0 18px}
.cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;max-width:820px;margin-top:10px}
.stat{padding:14px;text-align:center}
.stat b{display:block;font:700 28px var(--f-px);color:var(--lime);font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);margin-right:6px;animation:p 1.8s infinite}
@keyframes p{50%{opacity:.35}}
/* promo band */
.band{background:linear-gradient(90deg,var(--lime),var(--orange));color:var(--lime-d)}
.band .wrap{display:flex;gap:16px;align-items:center;padding-block:12px;flex-wrap:wrap;justify-content:center}
.band b{font:700 20px var(--f-px)}.band span{font-weight:600}
.band .btn{background:var(--lime-d);color:var(--lime);padding:8px 16px}
/* why */
.why{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.why .card{padding:22px}.why h3{font-size:19px;margin:12px 0 6px}.why p{margin:0;color:var(--mute)}
.why .wic{height:112px;border-radius:12px;background:radial-gradient(circle at 50% 40%,#30351f,#1b1e15);display:flex;align-items:center;justify-content:center}
.why .wic svg{width:84px;height:auto}
.rlw{position:relative;height:112px;overflow:hidden;border-radius:12px;background:#10120c;border:1px solid var(--line)}
.rlt{display:flex;gap:8px;position:absolute;left:0;top:0;padding:10px 0;animation:rlmove 28s linear infinite}
.rlw:hover .rlt{animation-play-state:paused}
@keyframes rlmove{to{transform:translateX(-50%)}}
.rcc{width:96px;height:92px;flex:none;border-radius:10px;background:var(--panel2);border:1px solid var(--line);border-bottom:4px solid var(--c,var(--mute));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;text-align:center;padding:4px;color:var(--mute)}
.rcc svg{width:44px;height:auto}
.rcc img{width:50px;height:50px;object-fit:contain}
.why .wic img{height:92px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.why .wic.collage{gap:0;padding-inline:8px;overflow:hidden}
.why .wic.collage img{flex:1 1 0;width:0;min-width:0;height:78px;max-width:none;margin-inline:-5px}
.emb{display:block;width:100%;max-width:230px;aspect-ratio:1;margin:0 auto;object-fit:contain;transition:transform .2s}
.card:hover>.emb{transform:scale(1.04)}
.grp{font:700 24px var(--f-px);margin:30px 0 16px;color:var(--lime)}
.rlm{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:var(--orange);box-shadow:0 0 14px var(--orange);z-index:2}
.rlw::before,.rlw::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:1;pointer-events:none}
.rlw::before{left:0;background:linear-gradient(90deg,#10120c,transparent)}.rlw::after{right:0;background:linear-gradient(270deg,#10120c,transparent)}
/* ranks */
.ranks{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.rank{padding:18px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.rank h3{font:700 19px var(--f-px)}.rank .hrs{font-size:13px;color:var(--lime);font-weight:600}.rank p{margin:0;font-size:13px;color:var(--mute)}
.rank svg{width:60px;height:auto}
/* shop */
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.pill{border:1px solid var(--line);background:var(--panel2);padding:7px 15px;border-radius:20px;font-weight:600;font-size:14px;color:var(--mute)}
.pill:hover{color:var(--fg)}.pill.on{background:var(--lime);color:var(--lime-d);border-color:var(--lime)}
.items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;transition:.12s}
.item:hover{border-color:var(--lime);transform:translateY(-3px)}
.item .ic{height:92px;border-radius:9px;background:radial-gradient(circle at 50% 40%,#30351f,#1b1e15);display:flex;align-items:center;justify-content:center}
.item .ic svg{width:64px;height:auto}
.item .nm{font-size:14px;font-weight:500;line-height:1.25}.item .ft{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.tag{position:absolute;top:8px;left:8px;font:700 10px var(--f-ui);padding:2px 7px;border-radius:5px;background:var(--orange);color:#2a1604;letter-spacing:.5px}
.note{margin-top:18px;text-align:center;color:var(--mute);font-size:14px}
/* kits */
.kits{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kit{padding:16px;display:flex;flex-direction:column;gap:10px}
.kit.prem{border-color:#7a5a22}
.kit .top{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.kit h3{font:700 20px var(--f-px)}.kit ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px;color:var(--mute)}
.kit li::before{content:"+ ";color:var(--lime);font-weight:600}
.kit .cd{margin-top:auto;font-size:13px;border-top:1px dashed var(--line);padding-top:10px}
/* wipe */
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.next{padding:28px;text-align:center;background:linear-gradient(135deg,var(--lime),var(--orange));color:var(--lime-d);border:0}
.next b.px{font-size:30px;display:block}
.cd4{display:flex;gap:10px;justify-content:center;margin:16px 0}
.cd4 div{background:rgba(0,0,0,.22);border-radius:10px;padding:10px 14px;min-width:70px}
.cd4 b{display:block;font:700 30px var(--f-px);font-variant-numeric:tabular-nums}.cd4 span{font-size:12px;font-weight:600}
.wl{padding:8px}.wl li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.wl li:last-child{border:0}.wl ul{margin:0;padding:0}
.wl b{color:var(--lime)}
/* rules + cmds */
.rules .card{padding:22px}
.rules h3{text-align:center;font-size:19px;margin-bottom:16px}
.rule{display:flex;gap:14px;margin-bottom:14px}.rule .n{font:700 24px/1 var(--f-px);color:var(--orange);width:24px;flex:none}
.rule b{display:block}.rule span{font-size:14px;color:var(--mute)}
.cmds{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.cmd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:14px}
.cmd code{font:600 14px ui-monospace,Consolas,monospace;color:var(--lime);background:none;border:0;cursor:pointer;padding:0}
.cmd code:hover{text-decoration:underline}
/* top */
.search{width:100%;max-width:360px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 15px var(--f-ui);padding:0 14px;display:block;margin:0 auto 18px}
.tw{overflow-x:auto;padding:6px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:12px 14px;text-align:left;font-size:15px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #2b3023;font-variant-numeric:tabular-nums}tr:last-child td{border:0}
tbody tr:hover{background:var(--panel3)}
.pos{font:700 18px var(--f-px);color:var(--orange);width:56px}
.rk{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--lime);font-weight:600}
/* donate */
.don{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.dc{padding:22px;display:flex;flex-direction:column;gap:12px;position:relative}
.dc.hot{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime),0 0 30px rgba(212,232,90,.14)}
.dc h3{font:700 24px var(--f-px)}.dc .pr{font:700 30px var(--f-ui);color:var(--orange)}
.dc ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;color:var(--mute);font-size:14px;flex:1}
.dc li::before{content:"+ ";color:var(--lime);font-weight:600}
/* faq */
.faq{max-width:820px;margin:0 auto;display:grid;gap:10px}
details{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:0}
summary{cursor:pointer;padding:16px 20px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";color:var(--lime);font:700 22px/1 var(--f-px)}
details[open] summary::after{content:"−"}
details p{margin:0;padding:0 20px 18px;color:var(--mute)}
/* discord + footer */
.dis{padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.dis .big{font:700 clamp(24px,5vw,38px) var(--f-px);color:var(--green);overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);padding-block:28px;color:var(--dim);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--lime);color:var(--lime-d);font-weight:600;padding:10px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:1020px){
  .burger{display:flex;margin-left:auto}
  nav.main{position:absolute;left:0;right:0;top:72px;background:var(--panel);border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px));display:none}
  nav.main.open{display:block}
  .tabs{clip-path:none;flex-direction:column;align-items:stretch;height:auto;padding:6px;border-bottom:0;background:none}
  .tabs a{padding:12px 10px;border-bottom:1px solid var(--line)}.tabs a.on::after{display:none}
  .hd>.btn{display:none}
}
@media(max-width:560px){section{padding-block:44px}.ttl i{display:none}.cd4 div{min-width:58px;padding:8px 10px}.cd4 b{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* v3 additions */
.hd .acc{display:flex;gap:8px;align-items:center}
.btn.sm{padding:8px 14px;font-size:14px}
.ico{width:46px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.ico:hover{border-color:var(--lime)}.ico.on{background:var(--lime);color:var(--lime-d)}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:5px 12px 5px 6px;font-weight:600;font-size:14px}
.me i{width:32px;height:32px;border-radius:8px;background:var(--lime);color:var(--lime-d);display:flex;align-items:center;justify-content:center;font:700 16px var(--f-px);font-style:normal}
.cab{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cab .card{padding:20px;display:flex;flex-direction:column;gap:10px}
.cab h3{font-size:16px}
.bar{height:14px;border-radius:7px;background:#12140e;border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(115deg,var(--lime) 0 10px,#b9cf3e 10px 20px);border-radius:7px}
.badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.badge.lime{background:var(--lime);color:var(--lime-d);border-color:var(--lime)}.badge.org{background:var(--orange);color:#2a1604;border-color:var(--orange)}
.kr{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--panel);border-radius:8px;font-size:14px}
.kr b{font-variant-numeric:tabular-nums}.ok{color:var(--lime)}.wt{color:var(--orange)}
.mapg{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
.mapc{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.mapc canvas{width:100%;max-width:380px;aspect-ratio:1;image-rendering:pixelated;border-radius:10px;border:1px solid var(--line);background:#10120c}
.vote{display:flex;gap:14px;align-items:center;padding:12px}
.vote canvas{width:92px;height:92px;flex:none;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line)}
.vote .vi{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vote.mine{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}
.wk{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wk:last-child{border:0}.wk small{color:var(--dim);display:block;font-size:12px}
.rm{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.rm nav{display:flex;flex-direction:column;gap:6px}
.rm nav button{text-align:left;border:0;border-radius:9px;background:var(--panel2);padding:11px 14px;font-weight:600;font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.rm nav button:hover{color:var(--fg)}.rm nav button.on{background:var(--lime);color:var(--lime-d)}
.rm .pane{padding:22px;min-height:340px}
.rm .pane h3{font:700 22px var(--f-px);margin-bottom:16px}
.rm .pn{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.rm .srch{width:100%;margin-bottom:12px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 15px var(--f-ui);padding:0 14px}
.ftr{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:28px;padding-block:40px 24px}
.ftr h4{margin:0 0 12px;font-size:14px;color:var(--fg)}
.ftr ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ftr a,.ftr button.lk{color:var(--mute);text-decoration:none;font-size:14px;background:none;border:0;padding:0;text-align:left}
.ftr a:hover,.ftr button.lk:hover{color:var(--lime)}
.soc{display:flex;gap:10px;margin-top:14px}
.soc a{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:var(--panel2)}
.soc a:hover{color:var(--lime);border-color:var(--lime)}
.fb{border-top:1px solid var(--line);padding-block:18px 28px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.fb nav{display:flex;gap:16px;flex-wrap:wrap}.fb button{background:none;border:0;color:var(--dim);font-size:13px;padding:0}.fb button:hover{color:var(--lime)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px #000}
.md h3{font:700 24px var(--f-px)}.md p{margin:0;color:var(--mute)}.md .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
.inp{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:500 15px var(--f-ui);padding:0 12px;min-width:0;width:100%}
.inp:focus{outline:2px solid var(--lime);border-color:var(--lime)}
