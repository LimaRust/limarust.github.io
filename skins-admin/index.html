<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lima Rust · Скины, админка</title>
<style>
:root{--bg:#171a12;--panel:#212519;--panel2:#2a2f20;--line:#343a28;--lime:#d4e85a;--limed:#1b2108;--orange:#f29a3c;--red:#e5574b;--text:#f0f2e4;--mute:#98a088;--dim:#6b7455}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0}
h1 b{color:var(--lime)} h1 i{font-style:normal;color:var(--orange)}
.stat{color:var(--mute);font-size:13px}
.stat b{color:var(--text)}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer} button:hover{border-color:var(--lime)}
button.pri{background:var(--lime);color:var(--limed);border-color:var(--lime);font-weight:700}
button.warn{background:#3a2420;border-color:#6a3a32}
.grow{flex:1}
main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);padding:12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
aside input{width:100%;margin-bottom:8px}
.item{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--panel2)} .item.on{background:var(--lime);color:var(--limed);font-weight:700}
.item small{color:var(--dim)} .item.on small{color:var(--limed)}
section{padding:14px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{min-width:240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.hid{opacity:.4} .card.vip{border-color:var(--orange)}
.thumb{aspect-ratio:1/1;background:#0f110b center/contain no-repeat;position:relative}
.badge{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:700;background:var(--lime);color:var(--limed)}
.badge.no{background:var(--orange)}
.subs{position:absolute;right:6px;top:6px;font-size:11px;color:var(--text);background:#000a;padding:2px 6px;border-radius:99px}
.meta{padding:8px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.8em}
.title a{color:inherit;text-decoration:none} .title a:hover{color:var(--lime)}
.id{color:var(--dim);font-size:11px}
.acts{display:flex;gap:6px;margin-top:auto}
.acts button{flex:1;padding:5px 6px;font-size:12px}
.acts button.on{background:var(--red);border-color:var(--red)}
.acts button.vipon{background:var(--orange);color:var(--limed);border-color:var(--orange)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0}
.hint{color:var(--mute);padding:30px;text-align:center}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:640px;width:92vw}
dialog textarea{width:100%;height:240px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace}
@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static;height:auto;max-height:240px;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1><b>Lima</b> <i>Rust</i> · скины</h1>
  <span class="stat">Скрыто: <b id="sHid">0</b> · VIP: <b id="sVip">0</b></span>
  <span class="grow"></span>
  <button id="bImport">Импорт</button>
  <button id="bExport" class="pri">Экспорт для сервера</button>
  <button id="bReset" class="warn">Сбросить всё</button>
</header>
<div id="banner" style="display:none;background:#3a2d12;color:var(--text);padding:8px 16px;font-size:13px"></div>
<main>
  <aside>
    <input id="itemSearch" type="search" placeholder="Предмет…">
    <div id="items"></div>
  </aside>
  <section>
    <div class="bar">
      <input id="q" type="search" placeholder="Поиск по названию или ID">
      <select id="fAcc"><option value="all">Все</option><option value="1">Только одобренные</option><option value="0">Только неодобренные</option></select>
      <select id="fSort"><option value="subs">Сначала популярные</option><option value="name">По названию</option><option value="id">Сначала новые</option></select>
      <select id="fState"><option value="all">Любое состояние</option><option value="hid">Скрытые</option><option value="vip">VIP</option><option value="show">Показываются</option></select>
      <span class="grow"></span>
      <select id="vipPerm" title="Какая привилегия нужна для VIP-скинов"></select>
    </div>
    <div class="bar" id="bulk">
      <button id="bHidePage">Скрыть всё на странице</button>
      <button id="bHideUn">Скрыть все неодобренные в предмете</button>
      <button id="bShowAll">Показать всё в предмете</button>
      <button id="bHideUnAll" class="warn">Скрыть неодобренные во ВСЕХ предметах</button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="pager"><button id="pPrev">‹</button><span id="pInfo"></span><button id="pNext">›</button></div>
  </section>
</main>
<dialog id="lb" style="max-width:900px;width:96vw;padding:14px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 id="lbTitle" style="margin:0"></h3><button id="lbClose">✕</button></div>
  <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
    <button id="lbPrev" style="font-size:22px">‹</button>
    <div id="lbImg" style="flex:1;aspect-ratio:1/1;max-height:62vh;background:#0f110b center/contain no-repeat;border-radius:10px"></div>
    <button id="lbNext" style="font-size:22px">›</button>
  </div>
  <div id="lbInfo" style="color:var(--mute);margin-bottom:10px"></div>
  <div class="acts" style="display:flex;gap:8px;align-items:center"><span id="lbCount" class="stat"></span><span class="grow"></span><button id="lbHid" style="min-width:160px"></button><button id="lbVip" style="min-width:160px"></button></div>
</dialog>
<dialog id="dlg"><h3 id="dTitle" style="margin-top:0"></h3><textarea id="dText"></textarea><p style="display:flex;gap:8px;justify-content:flex-end"><button id="dOk" class="pri">OK</button><button id="dClose">Закрыть</button></p></dialog>
<script>
(function(){
'use strict';
var BASE='../skins-data/', CDN='https://images.steamusercontent.com/ugc/', PER=60;
var PERMS=['limaskins.vip','limaskins.vip2','limaskins.vip3'];
var items={}, order=[], counts={}, cache={}, cur='', page=0;
var st=load();

function load(){try{var s=JSON.parse(localStorage.getItem('lima-skins-curation')||'{}');return {hid:s.hid||{},vip:s.vip||{}}}catch(e){return {hid:{},vip:{}}}}
function save(){try{localStorage.setItem('lima-skins-curation',JSON.stringify(st))}catch(e){}stats()}
function $(i){return document.getElementById(i)}
function stats(){$('sHid').textContent=Object.keys(st.hid).length;$('sVip').textContent=Object.keys(st.vip).length}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function get(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}

PERMS.forEach(function(p){var o=document.createElement('option');o.value=p;o.textContent='VIP → '+p;$('vipPerm').appendChild(o)});

Promise.all([get(BASE+'items.json'),get(BASE+'site_index.json'),get(BASE+'site_meta.json').catch(function(){return null})]).then(function(r){
  items=r[0];counts=r[1];
  var m=r[2];
  if(m&&!m.complete){$('banner').style.display='block';$('banner').textContent='Данные ещё догружаются: показано '+m.rows.toLocaleString('ru')+' из ~'+m.total.toLocaleString('ru')+' скинов. Страница обновится сама, когда всё будет готово.'}
  else if(m){$('banner').style.display='block';$('banner').style.background='#25301a';$('banner').textContent='Все данные загружены: '+m.rows.toLocaleString('ru')+' скинов, из них принято Steam: '+m.accepted.toLocaleString('ru')}
  order=Object.keys(counts).sort(function(a,b){return name(a).localeCompare(name(b))});
  cur=order[0]||'';
  drawItems();openItem(cur);stats();
}).catch(function(e){$('grid').innerHTML='<div class="hint">Не удалось загрузить данные: '+esc(e.message)+'</div>'});

function name(sn){var v=items[sn];return v?v.split('|')[0]:sn}

function drawItems(){
  var q=$('itemSearch').value.toLowerCase(),h='';
  order.forEach(function(sn){
    if(q&&name(sn).toLowerCase().indexOf(q)<0)return;
    h+='<div class="item'+(sn===cur?' on':'')+'" data-sn="'+esc(sn)+'"><span>'+esc(name(sn))+'</span><small>'+counts[sn]+'</small></div>';
  });
  $('items').innerHTML=h||'<div class="hint">Ничего</div>';
}
$('items').addEventListener('click',function(e){var d=e.target.closest('.item');if(d)openItem(d.dataset.sn)});
$('itemSearch').addEventListener('input',drawItems);

function openItem(sn){
  cur=sn;page=0;drawItems();
  if(cache[sn]){draw();return}
  $('grid').innerHTML='<div class="hint">Загрузка…</div>';
  get(BASE+'site/'+sn+'.json').then(function(rows){cache[sn]=rows;if(cur===sn)draw()}).catch(function(e){$('grid').innerHTML='<div class="hint">Нет данных: '+esc(e.message)+'</div>'});
}

function filtered(){
  var rows=cache[cur]||[],q=$('q').value.trim().toLowerCase(),acc=$('fAcc').value,stt=$('fState').value,sort=$('fSort').value;
  var out=rows.filter(function(r){
    if(q&&String(r[1]).toLowerCase().indexOf(q)<0&&r[0]!==q)return false;
    if(acc!=='all'&&String(r[3])!==acc)return false;
    var hid=!!st.hid[r[0]],vip=!!st.vip[r[0]];
    if(stt==='hid'&&!hid)return false;if(stt==='vip'&&!vip)return false;if(stt==='show'&&hid)return false;
    return true;
  });
  out.sort(function(a,b){return sort==='subs'?b[4]-a[4]:sort==='name'?String(a[1]).localeCompare(String(b[1])):(a[0]<b[0]?1:-1)});
  return out;
}

function draw(){
  var list=filtered(),pages=Math.max(1,Math.ceil(list.length/PER));
  page=Math.min(page,pages-1);
  curList=list;
  var slice=list.slice(page*PER,page*PER+PER),h='';
  slice.forEach(function(r,i){
    var id=r[0],hid=!!st.hid[id],vip=st.vip[id];
    var img=r[2]?CDN+r[2]+'/?imw=256&imh=256&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false':'';
    h+='<div class="card'+(hid?' hid':'')+(vip?' vip':'')+'" data-id="'+id+'" data-i="'+(page*PER+i)+'">'+
      '<div class="thumb" data-open="1" style="cursor:zoom-in;'+(img?'background-image:url('+img+')':'')+'"><span class="badge'+(r[3]?'':' no')+'">'+(r[3]?'✓ одобрен':'⚠ не одобрен')+'</span><span class="subs">★ '+r[4]+'</span></div>'+
      '<div class="meta"><div class="title"><a target="_blank" rel="noopener" href="https://steamcommunity.com/sharedfiles/filedetails/?id='+id+'">'+esc(r[1])+'</a></div><div class="id">Предмет: <b>'+esc(name(cur))+'</b></div><div class="id">'+id+(vip?' · '+esc(vip):'')+'</div>'+
      '<div class="acts"><button data-a="hid" class="'+(hid?'on':'')+'">'+(hid?'Скрыт':'Скрыть')+'</button><button data-a="vip" class="'+(vip?'vipon':'')+'">VIP</button></div></div></div>';
  });
  $('grid').innerHTML=h||'<div class="hint">Ничего не найдено</div>';
  $('pInfo').textContent=(page+1)+' / '+pages+' · '+list.length+' скинов';
}

var curList=[],lbIndex=0;
function lbDraw(){
  var r=curList[lbIndex];if(!r)return;
  var id=r[0],hid=!!st.hid[id],vip=st.vip[id];
  var img=r[2]?CDN+r[2]+'/?imw=1000&imh=1000&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false':'';
  $('lbImg').style.backgroundImage=img?'url('+img+')':'none';
  $('lbTitle').textContent=r[1];
  $('lbInfo').innerHTML='Предмет: <b>'+esc(name(cur))+'</b> · метка в Steam: «'+esc(r[5]||'—')+'»<br>ID '+id+' · '+(r[3]?'<b style="color:var(--lime)">одобрен Steam</b>':'<b style="color:var(--orange)">не одобрен</b>')+' · ★ '+r[4]+'<br><a target="_blank" rel="noopener" style="color:var(--lime)" href="https://steamcommunity.com/sharedfiles/filedetails/?id='+id+'">Открыть в Steam</a>';
  $('lbCount').textContent=(lbIndex+1)+' из '+curList.length;
  $('lbHid').textContent=hid?'Скрыт (вернуть)':'Скрыть';$('lbHid').className=hid?'on':'';
  $('lbVip').textContent=vip?'VIP: '+vip:'Сделать VIP';$('lbVip').className=vip?'vipon':'';
}
function lbStep(d){lbIndex=(lbIndex+d+curList.length)%curList.length;lbDraw()}
$('lbPrev').onclick=function(){lbStep(-1)};$('lbNext').onclick=function(){lbStep(1)};
$('lbClose').onclick=function(){$('lb').close();draw()};
$('lbHid').onclick=function(){var id=curList[lbIndex][0];if(st.hid[id])delete st.hid[id];else st.hid[id]=1;save();lbDraw()};
$('lbVip').onclick=function(){var id=curList[lbIndex][0];if(st.vip[id])delete st.vip[id];else st.vip[id]=$('vipPerm').value;save();lbDraw()};
$('lb').addEventListener('keydown',function(e){if(e.key==='ArrowLeft')lbStep(-1);if(e.key==='ArrowRight')lbStep(1)});

$('grid').addEventListener('click',function(e){
  var t=e.target.closest('.thumb');
  if(t&&!e.target.closest('a')){lbIndex=+t.closest('.card').dataset.i;$('lb').showModal();lbDraw();return}
  var b=e.target.closest('button');if(!b)return;
  var id=b.closest('.card').dataset.id,a=b.dataset.a;
  if(a==='hid'){if(st.hid[id])delete st.hid[id];else st.hid[id]=1}
  if(a==='vip'){if(st.vip[id])delete st.vip[id];else st.vip[id]=$('vipPerm').value}
  save();draw();
});

['q','fAcc','fSort','fState'].forEach(function(i){$(i).addEventListener('input',function(){page=0;draw()})});
$('pPrev').onclick=function(){if(page>0){page--;draw();scrollTo(0,0)}};
$('pNext').onclick=function(){page++;draw();scrollTo(0,0)};

$('bHidePage').onclick=function(){filtered().slice(page*PER,page*PER+PER).forEach(function(r){st.hid[r[0]]=1});save();draw()};
$('bHideUn').onclick=function(){(cache[cur]||[]).forEach(function(r){if(!r[3])st.hid[r[0]]=1});save();draw()};
$('bShowAll').onclick=function(){(cache[cur]||[]).forEach(function(r){delete st.hid[r[0]]});save();draw()};
$('bHideUnAll').onclick=function(){
  if(!confirm('Скрыть все неодобренные скины во всех предметах? Загрузка может занять минуту.'))return;
  var left=order.length,btn=$('bHideUnAll');btn.disabled=true;
  order.forEach(function(sn){
    var done=function(rows){rows.forEach(function(r){if(!r[3])st.hid[r[0]]=1});if(--left===0){btn.disabled=false;save();draw()}};
    if(cache[sn])done(cache[sn]);else get(BASE+'site/'+sn+'.json').then(function(rows){cache[sn]=rows;done(rows)}).catch(function(){done([])});
  });
};

function dialog(title,text,ok){$('dTitle').textContent=title;$('dText').value=text;$('dOk').onclick=function(){$('dlg').close();if(ok)ok($('dText').value)};$('dlg').showModal()}
$('dClose').onclick=function(){$('dlg').close()};
function exportJson(){
  var vip={};Object.keys(st.vip).forEach(function(id){(vip[st.vip[id]]=vip[st.vip[id]]||[]).push(id)});
  return JSON.stringify({Hidden:Object.keys(st.hid),Vip:vip});
}
$('bExport').onclick=function(){
  var t=exportJson();
  dialog('Экспорт: сохрани это как curation.json и отправь Claude (или положи в oxide/data/LimaSkins/)',t);
  var ta=$('dText');ta.select();try{navigator.clipboard.writeText(t)}catch(e){}
};
$('bImport').onclick=function(){
  dialog('Импорт: вставь JSON из экспорта','',function(t){
    try{var j=JSON.parse(t);st={hid:{},vip:{}};(j.Hidden||[]).forEach(function(id){st.hid[id]=1});
      Object.keys(j.Vip||{}).forEach(function(p){j.Vip[p].forEach(function(id){st.vip[id]=p})});save();draw()}catch(e){alert('Не получилось прочитать: '+e.message)}
  });
};
$('bReset').onclick=function(){if(confirm('Очистить все отметки?')){st={hid:{},vip:{}};save();draw()}};
})();
</script>
</body>
</html>
