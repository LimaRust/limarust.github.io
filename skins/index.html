<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Скины · Lima Rust</title>
<meta name="description" content="Все скины воркшопа Rust: какие уже загружены на сервер Lima Rust, какие одобрены и какие нет.">
<style>
:root{--bg:#171a12;--panel:#212519;--panel2:#2a2f20;--line:#343a28;--lime:#d4e85a;--limed:#1b2108;--orange:#f29a3c;--text:#f0f2e4;--mute:#98a088;--dim:#6b7455}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header a.back{color:var(--lime);text-decoration:none;font-weight:700}
h1{font-size:18px;margin:0 8px 0 0}h1 b{color:var(--lime)}h1 i{font-style:normal;color:var(--orange)}
.grow{flex:1}
button,select,input{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer}button:hover{border-color:var(--lime)}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.t-on{background:var(--lime);color:var(--limed)}.t-ok{background:#3b4a1c;color:var(--lime)}.t-no{background:var(--orange);color:var(--limed)}
main{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 110px)}
aside{border-right:1px solid var(--line);padding:12px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
aside input{width:100%;margin-bottom:8px}
.item{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer}
.item:hover{background:var(--panel2)}.item.on{background:var(--lime);color:var(--limed);font-weight:700}
.item small{color:var(--dim)}.item.on small{color:var(--limed)}
section{padding:14px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{min-width:220px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.priv{border-color:var(--orange)}
.thumb{aspect-ratio:1/1;background:#0f110b center/contain no-repeat;position:relative;cursor:zoom-in}
.thumb .tag{position:absolute;top:6px;left:6px}
.meta{padding:8px 10px}
.title{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.8em;font-size:14px}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0}
.fav{position:absolute;top:6px;right:6px;width:32px;height:32px;padding:0;border-radius:50%;font-size:17px;line-height:1;background:#000a;color:var(--mute)}.fav.on{background:var(--orange);color:var(--limed);border-color:var(--orange)}
.hint{color:var(--mute);padding:30px;text-align:center}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:900px;width:96vw;padding:14px}
@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static;height:auto;max-height:220px;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <a class="back" href="../">‹ На сайт</a>
  <h1><b>Lima</b> <i>Rust</i> · скины</h1>
  <span class="grow"></span>
  <span id="count" style="color:var(--mute);font-size:13px"></span>
  <button id="bMine">★ Мои <span id="mineN">0</span></button>
</header>
<div class="legend">
  <span><span class="tag t-on">Загружен</span> есть на сервере, ставится в меню <b>/skin</b></span>
  <span><span class="tag t-ok">Одобрен</span> принят Steam, на сервер пока не добавлен</span>
  <span><span class="tag t-no">Не одобрен</span> не принят в игру, на обычных серверах может не показываться</span>
</div>
<main>
  <aside><input id="itemSearch" type="search" placeholder="Предмет…"><div id="items"></div></aside>
  <section>
    <div class="bar">
      <input id="q" type="search" placeholder="Поиск по названию или ID">
      <select id="fStatus"><option value="all">Все статусы</option><option value="on">Загружены на сервер</option><option value="ok">Одобрены, не загружены</option><option value="no">Не одобрены</option></select>
      <select id="fSort"><option value="subs">Сначала популярные</option><option value="name">По названию</option><option value="id">Сначала новые</option></select>
    </div>
    <div id="mineBar" class="bar" style="display:none"><b>Мои скины</b> <span style="color:var(--mute);font-size:13px">хранятся только в этом браузере</span><span class="grow"></span><button id="bCopy">Скопировать список</button><button id="bClear">Очистить</button></div>
    <div id="grid" class="grid"></div>
    <div class="pager"><button id="pPrev">‹</button><span id="pInfo"></span><button id="pNext">›</button></div>
  </section>
</main>
<dialog id="lb">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 id="lbTitle" style="margin:0"></h3><button id="lbClose">✕</button></div>
  <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
    <button id="lbPrev" style="font-size:22px">‹</button>
    <div id="lbImg" style="flex:1;aspect-ratio:1/1;max-height:62vh;background:#0f110b center/contain no-repeat;border-radius:10px"></div>
    <button id="lbNext" style="font-size:22px">›</button>
  </div>
  <div id="lbInfo" style="color:var(--mute)"></div>
  <div id="lbCount" style="color:var(--dim);font-size:12px;margin-top:6px"></div>
</dialog>
<script>
(function(){
'use strict';
var BASE='../skins-data/',CDN='https://images.steamusercontent.com/ugc/',PER=48;
var fav=loadFav(),mine=false,mineRows=[],items={},counts={},order=[],cache={},cur='',page=0,onServer={},hidden={},vip={},names={},list=[],lbIndex=0;
function $(i){return document.getElementById(i)}
function loadFav(){try{return JSON.parse(localStorage.getItem('lima-skins-fav')||'{}')}catch(e){return {}}}
function saveFav(){try{localStorage.setItem('lima-skins-fav',JSON.stringify(fav))}catch(e){}$('mineN').textContent=Object.keys(fav).length}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function get(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function name(sn){var v=items[sn];return v?v.split('|')[0]:sn}
function status(r){return onServer[r[0]]?'on':(r[3]?'ok':'no')}
var LABEL={on:'Загружен',ok:'Одобрен',no:'Не одобрен'},CLS={on:'t-on',ok:'t-ok',no:'t-no'};

Promise.all([get(BASE+'items.json'),get(BASE+'site_index.json'),get(BASE+'server_skins.json').catch(function(){return []}),get(BASE+'curation.json').catch(function(){return {}})]).then(function(r){
  items=r[0];counts=r[1];
  r[2].forEach(function(id){onServer[id]=1});
  var c=r[3]||{};(c.Hidden||[]).forEach(function(id){hidden[id]=1});
  Object.keys(c.Vip||{}).forEach(function(p){c.Vip[p].forEach(function(id){vip[id]=p})});names=c.Names||{};
  order=Object.keys(counts).sort(function(a,b){return name(a).localeCompare(name(b))});
  var qs=new URLSearchParams(location.search).get('item');cur=(qs&&counts[qs])?qs:(order.indexOf('wall.frame.garagedoor')>=0?'wall.frame.garagedoor':order[0]);
  var total=0;Object.keys(counts).forEach(function(k){total+=counts[k]});$('count').textContent=total.toLocaleString('ru')+' скинов · '+Object.keys(onServer).length.toLocaleString('ru')+' на сервере';
  $('mineN').textContent=Object.keys(fav).length;drawItems();openItem(cur);
}).catch(function(e){$('grid').innerHTML='<div class="hint">Не удалось загрузить данные: '+esc(e.message)+'</div>'});

function drawItems(){
  var q=$('itemSearch').value.toLowerCase(),h='';
  order.forEach(function(sn){if(q&&name(sn).toLowerCase().indexOf(q)<0)return;h+='<div class="item'+(sn===cur?' on':'')+'" data-sn="'+esc(sn)+'"><span>'+esc(name(sn))+'</span><small>'+counts[sn]+'</small></div>'});
  $('items').innerHTML=h||'<div class="hint">Ничего</div>';
}
$('items').addEventListener('click',function(e){var d=e.target.closest('.item');if(d)openItem(d.dataset.sn)});
$('itemSearch').addEventListener('input',drawItems);

function openItem(sn){
  mine=false;$('mineBar').style.display='none';cur=sn;page=0;drawItems();
  if(cache[sn]){draw();return}
  $('grid').innerHTML='<div class="hint">Загрузка…</div>';
  get(BASE+'site/'+sn+'.json').then(function(rows){rows.forEach(function(r){r[6]=sn});cache[sn]=rows.filter(function(r){return !hidden[r[0]]});if(cur===sn)draw()}).catch(function(e){$('grid').innerHTML='<div class="hint">Нет данных: '+esc(e.message)+'</div>'});
}
function filtered(){
  var rows=mine?mineRows:(cache[cur]||[]),q=$('q').value.trim().toLowerCase(),f=$('fStatus').value,s=$('fSort').value;
  var out=rows.filter(function(r){return (!q||String(r[1]).toLowerCase().indexOf(q)>=0||r[0]===q)&&(f==='all'||status(r)===f)});
  out.sort(function(a,b){return s==='subs'?b[4]-a[4]:s==='name'?String(a[1]).localeCompare(String(b[1])):(a[0]<b[0]?1:-1)});
  return out;
}
function img(r,size){return r[2]?CDN+r[2]+'/?imw='+size+'&imh='+size+'&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false':''}
function draw(){
  list=filtered();var pages=Math.max(1,Math.ceil(list.length/PER));page=Math.min(page,pages-1);
  var h='';
  list.slice(page*PER,page*PER+PER).forEach(function(r,i){
    var st=status(r),p=vip[r[0]];
    h+='<div class="card'+(p?' priv':'')+'" data-i="'+(page*PER+i)+'"><div class="thumb" style="'+(img(r,256)?'background-image:url('+img(r,256)+')':'')+'"><span class="tag '+CLS[st]+'">'+LABEL[st]+'</span><button class="fav'+(fav[r[0]]?' on':'')+'" data-fav="'+r[0]+'" title="Сохранить себе">'+(fav[r[0]]?'★':'☆')+'</button></div>'+
       '<div class="meta"><div class="title">'+esc(r[1])+'</div><div class="sub">'+(p?'для «'+esc(names[p]||p.replace('limaskins.',''))+'» · ':'')+'★ '+r[4]+'</div></div></div>';
  });
  $('grid').innerHTML=h||'<div class="hint">Ничего не найдено</div>';
  $('pInfo').textContent=(page+1)+' / '+pages+' · '+list.length+' скинов'
}
$('grid').addEventListener('click',function(e){var fb=e.target.closest('.fav');if(fb){toggleFav(fb.dataset.fav);return}var c=e.target.closest('.card');if(!c)return;lbIndex=+c.dataset.i;$('lb').showModal();lbDraw()});
function toggleFav(id){var r=null;for(var i=0;i<list.length;i++)if(list[i][0]===id){r=list[i];break}if(fav[id])delete fav[id];else if(r)fav[id]=r[6]||cur;saveFav();if(mine&&!fav[id]){mineRows=mineRows.filter(function(x){return x[0]!==id});}draw();if($('lb').open)lbDraw()}
function lbDraw(){
  var r=list[lbIndex];if(!r)return;var st=status(r),p=vip[r[0]];
  $('lbImg').style.backgroundImage=img(r,1000)?'url('+img(r,1000)+')':'none';
  $('lbTitle').textContent=r[1];
  $('lbInfo').innerHTML='<span class="tag '+CLS[st]+'">'+LABEL[st]+'</span> · Предмет: <b>'+esc(name(r[6]||cur))+'</b>'+(p?' · для «'+esc(names[p]||p)+'»':'')+' · ★ '+r[4]+'<br><button id="lbFav" style="margin:6px 0">'+(fav[r[0]]?'★ Сохранено у меня (убрать)':'☆ Сохранить себе')+'</button><br>ID '+r[0]+' · <a target="_blank" rel="noopener" style="color:var(--lime)" href="https://steamcommunity.com/sharedfiles/filedetails/?id='+r[0]+'">Открыть в Steam</a>'+
    (st==='on'?'<br>Ставится в игре через <b>/skin</b>.':st==='ok'?'<br>Принят Steam, но на сервер пока не добавлен.':'<br>Не принят в игру: на обычных серверах такой скин может не показываться.');
  $('lbCount').textContent=(lbIndex+1)+' из '+list.length;var lf=$('lbFav');if(lf)lf.onclick=function(){toggleFav(r[0])};
}
function step(d){lbIndex=(lbIndex+d+list.length)%list.length;lbDraw()}
$('lbPrev').onclick=function(){step(-1)};$('lbNext').onclick=function(){step(1)};$('lbClose').onclick=function(){$('lb').close()};
$('lb').addEventListener('keydown',function(e){if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
function openMine(){
  var ids=Object.keys(fav),need={};ids.forEach(function(id){need[fav[id]]=1});
  mine=true;page=0;$('mineBar').style.display='flex';$('grid').innerHTML='<div class="hint">Загрузка…</div>';
  Promise.all(Object.keys(need).map(function(sn){return cache[sn]?Promise.resolve():get(BASE+'site/'+sn+'.json').then(function(rows){rows.forEach(function(r){r[6]=sn});cache[sn]=rows.filter(function(r){return !hidden[r[0]]})}).catch(function(){})})).then(function(){
    mineRows=[];ids.forEach(function(id){var rs=cache[fav[id]]||[];for(var i=0;i<rs.length;i++)if(rs[i][0]===id){mineRows.push(rs[i]);break}});
    if(mine)draw();
  });
}
$('bMine').onclick=function(){if(mine){openItem(cur)}else openMine()};
$('bCopy').onclick=function(){var txt=mineRows.map(function(r){return r[0]+'\t'+name(r[6])+'\t'+r[1]}).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){alert('Список скопирован: ID, предмет, название')},function(){prompt('Скопируй список:',txt)});else prompt('Скопируй список:',txt)};
$('bClear').onclick=function(){if(confirm('Убрать все сохранённые скины?')){fav={};saveFav();mineRows=[];draw()}};
['q','fStatus','fSort'].forEach(function(i){$(i).addEventListener('input',function(){page=0;draw()})});
$('pPrev').onclick=function(){if(page>0){page--;draw();scrollTo(0,0)}};
$('pNext').onclick=function(){page++;draw();scrollTo(0,0)};
})();
</script>
</body>
</html>
